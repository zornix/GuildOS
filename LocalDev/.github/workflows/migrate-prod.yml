name: Migrate production database

# Manual gate, on purpose. This workflow is NOT coupled to deploys: production
# migrations are applied deliberately, by a human, BEFORE the code that needs
# the new schema merges (see LocalDev/docs/ops-runbook.md → "Deploy order").
# Vercel has no build hook that runs migrations, so nothing else applies them.
#
# This workflow is inert until BOTH of these are done:
#   1. PROD_PROJECT_REFS is filled in LocalDev/scripts/db_guard.py. Until then
#      require_prod() refuses before a connection is ever opened, so a run here
#      fails fast and harmlessly.
#   2. The repository secret PROD_DATABASE_URL is set (the prod Supabase pooler
#      URL). migrate_db.py --prod reads that variable only — never DATABASE_URL.
#
# Optional extra gate: create a GitHub environment named "production" with
# required reviewers and uncomment the `environment:` key below. (Left
# commented out because naming an environment changes run behavior.)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate-prod" to confirm. Anything else aborts.'
        required: true
        type: string

jobs:
  migrate:
    name: Apply pending migrations to production
    runs-on: ubuntu-latest
    # environment: production

    defaults:
      run:
        working-directory: LocalDev

    steps:
      - name: Check confirmation phrase
        # Belt on top of migrate_db.py's own --yes/typed-confirmation gate.
        # The input goes through env, not string interpolation, so it cannot
        # be injected into the shell.
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "migrate-prod" ]; then
            echo "::error::confirmation mismatch — type exactly: migrate-prod"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Show target and apply migrations
        # --yes skips the interactive typed confirmation (there is no TTY in
        # CI); the guards that matter still run: require_prod() rejects any URL
        # whose project ref is not in PROD_PROJECT_REFS, and each migration is
        # applied in its own transaction with rollback on failure.
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: python3 scripts/migrate_db.py --prod --yes
