name: LocalDev CI

# Gates merges on the two things that can actually break: the backend suite
# against a real, freshly migrated Postgres, and the frontend lint/unit/build.
# Playwright e2e is deliberately excluded — it needs a live API + DB stack.

on:
  push:
    paths:
      - "LocalDev/**"
  pull_request:
    paths:
      - "LocalDev/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: LocalDev

jobs:
  backend:
    name: Backend (migrate + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraternityos
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: fraternityos
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U fraternityos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # localhost classifies as "local" in scripts/db_guard.py, so require_demo
      # passes and the prod guards stay fail-closed.
      DATABASE_URL: postgresql://fraternityos:localdev@localhost:5434/fraternityos
      TEST_DATABASE_URL: postgresql://fraternityos:localdev@localhost:5434/fraternityos

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: LocalDev/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint (errors only)
        run: |
          pip install -r requirements-dev.txt
          python3 -m ruff check api scripts tests

      - name: Migration checksums
        run: python3 scripts/migration_checksums.py --check

      - name: Prepare environment
        # .env.example is the reference, but it is currently gitignored
        # (LocalDev/.gitignore) so it may be absent from a clean checkout —
        # hence the fallback. Its placeholder DATABASE_URL would classify as
        # "unknown" and trip require_demo, so CI-owned keys are stripped and
        # re-appended rather than inherited.
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else : > .env; fi
          grep -vE '^(DATABASE_URL|TEST_DATABASE_URL|SUPABASE_DB_URL|JWT_SECRET|CRON_SECRET|DEV_AUTH_BYPASS|MESSAGE_DELIVERY_MODE)=' .env > .env.ci || true
          mv .env.ci .env
          cat >> .env <<'EOF'
          APP_ENV=test
          DATABASE_URL=postgresql://fraternityos:localdev@localhost:5434/fraternityos
          TEST_DATABASE_URL=postgresql://fraternityos:localdev@localhost:5434/fraternityos
          JWT_SECRET=ci-only-secret-not-used-in-any-deployment-0123456789
          DEV_AUTH_BYPASS=false
          CRON_SECRET=ci-cron-secret
          MESSAGE_DELIVERY_MODE=dry_run
          EOF

      - name: Apply migrations
        run: python3 scripts/migrate_db.py

      - name: Run pytest
        run: python3 -m pytest

  greekos:
    name: Greekos (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: LocalDev/greekos

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: LocalDev/greekos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
